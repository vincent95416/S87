<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E2E 測試控制台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .status-bar {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.idle {
            background: #10b981;
        }

        .status-dot.busy {
            background: #f59e0b;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .test-selector {
            margin-bottom: 20px;
        }

        .test-selector label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }

        .test-selector select,
        .test-selector input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e5e7eb;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .test-selector select:focus,
        .test-selector input:focus {
            outline: none;
            border-color: #667eea;
        }

        .test-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #10b981;
            color: white;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #059669;
            transform: translateY(-2px);
        }

        .btn-outline {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-outline:hover {
            background: #667eea;
            color: white;
        }

        .result-panel {
            background: #f9fafb;
            border-radius: 6px;
            padding: 15px;
            margin-top: 15px;
            max-height: 400px;
            overflow-y: auto;
        }

        .result-item {
            background: white;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .result-item.success {
            border-left-color: #10b981;
        }

        .result-item.error {
            border-left-color: #ef4444;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .result-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-success {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-error {
            background: #fee2e2;
            color: #991b1b;
        }

        .result-details {
            font-size: 14px;
            color: #6b7280;
            line-height: 1.6;
        }

        .result-links {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        .result-links a {
            color: #667eea;
            text-decoration: none;
            font-size: 13px;
        }

        .result-links a:hover {
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .history-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .history-item {
            background: #f9fafb;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .history-item:hover {
            background: #f3f4f6;
        }

        .history-time {
            font-size: 12px;
            color: #9ca3af;
        }

        /* Trace Viewer 相關樣式 */
        .trace-sessions {
            display: grid;
            gap: 12px;
        }

        .trace-session {
            background: #f9fafb;
            border-radius: 8px;
            padding: 15px;
            border: 2px solid #e5e7eb;
            transition: all 0.3s;
        }

        .trace-session:hover {
            border-color: #667eea;
            background: #f3f4f6;
        }

        .session-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .session-title {
            font-weight: 600;
            color: #374151;
        }

        .session-count {
            background: #ef4444;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .trace-files {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #e5e7eb;
            gap: 8px;
            flex-direction: column;
        }

        .trace-files.active {
            display: flex;
        }

        .trace-file {
            background: white;
            padding: 10px 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .trace-file:hover {
            background: #ede9fe;
            transform: translateX(5px);
        }

        .trace-name {
            font-size: 14px;
            color: #374151;
        }

        .trace-size {
            font-size: 12px;
            color: #9ca3af;
        }

        .btn-view-trace {
            padding: 6px 12px;
            font-size: 13px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-view-trace:hover {
            background: #5568d3;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
        }

        .toolbar-buttons {
            display: flex;
            gap: 10px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .test-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎯 測試控制台</h1>
            <p>選擇項目並執行測試</p>
        </div>

        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-dot idle" id="statusDot"></div>
                <span id="statusText">系統閒置中</span>
            </div>
            <div class="toolbar-buttons">
                <button class="btn btn-outline" onclick="window.open('/api/reports/html', '_blank')">
                    📊 HTML 報告
                </button>
                <button class="btn btn-secondary" onclick="checkStatus()">更新狀態</button>
            </div>
        </div>

        <div class="main-content">
            <!-- 測試執行面板 -->
            <div class="card">
                <h2>執行測試</h2>

                <div class="test-selector">
                    <label>測試案例</label>
                    <select id="testCase">
                        <option value="regression">迴歸測試</option>
                        <option value="betting">大廳測試</option>
                    </select>
                </div>

                <div class="test-selector">
                    <label>環境</label>
                    <select id="env">
                        <option value="uat">使用者驗收環境 (UAT)</option>
                        <option value="dev">開發環境 (DEV)</option>
                    </select>
                </div>

                <div class="test-selector">
                    <label>站點</label>
                    <select id="site">
                        <option value="new20">NEW20</option>
                        <option value="spg">SPG(未開發)</option>
                    </select>
                </div>

                <div class="test-selector">
                    <label>自訂帳號 (選填)</label>
                    <input type="text" id="username" placeholder="留空使用預設帳號">
                </div>

                <div class="test-selector">
                    <label>自訂密碼 (選填)</label>
                    <input type="password" id="password" placeholder="留空使用預設密碼">
                </div>

                <div class="test-buttons">
                    <button class="btn btn-primary" onclick="runTest()" id="runBtn">
                        ▶️ 執行測試
                    </button>
                    <button class="btn btn-secondary" onclick="clearResults()">
                        🗑️ 清除結果
                    </button>
                </div>

                <div id="currentResult"></div>
            </div>

            <!-- 測試歷史面板 -->
            <div class="card">
                <h2>測試歷史</h2>
                <div class="history-list" id="historyList">
                    <p style="text-align: center; color: #9ca3af; padding: 40px;">
                        尚無測試記錄
                    </p>
                </div>
            </div>

            <!-- Trace Viewer 面板 -->
            <div class="card full-width">
                <h2>🔍 失敗測試追蹤 (Traces)</h2>
                <div id="traceContainer">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>載入中...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://${window.location.hostname}:8000';
        let testHistory = JSON.parse(localStorage.getItem('testHistory') || '[]');
        let isRunning = false;

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            checkStatus();
            renderHistory();
            loadTraceSessions();
        });

        // 檢查狀態
        async function checkStatus() {
            try {
                const response = await fetch(`${API_BASE}/status`);
                const data = await response.json();

                const statusDot = document.getElementById('statusDot');
                const statusText = document.getElementById('statusText');

                if (data.is_busy) {
                    statusDot.className = 'status-dot busy';
                    statusText.textContent = `執行中: ${data.current_test || '測試中'}`;
                    isRunning = true;
                } else {
                    statusDot.className = 'status-dot idle';
                    statusText.textContent = '系統閒置中';
                    isRunning = false;
                }

                document.getElementById('runBtn').disabled = isRunning;
            } catch (error) {
                console.error('無法連接到後端服務:', error);
                document.getElementById('statusText').textContent = '⚠️ 無法連接服務';
            }
        }

        // 執行測試
        async function runTest() {
            const testCase = document.getElementById('testCase').value;
            const env = document.getElementById('env').value;
            const site = document.getElementById('site').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const Url = `${API_BASE}/api/tests/${testCase}`
            const payload = { env, site};
            if (username) payload.username = username;
            if (password) payload.password = password;

            document.getElementById('currentResult').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>測試執行中，請稍候...</p>
                </div>
            `;

            document.getElementById('runBtn').disabled = true;
            isRunning = true;
            checkStatus();

            try {
                const response = await fetch(Url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                // 測試已啟動，顯示提示訊息
                document.getElementById('currentResult').innerHTML = `
                    <div class="result-panel">
                        <div class="result-item" style="border-left-color: #f59e0b;">
                            <div class="result-header">
                                <strong>⏳ ${result.message}</strong>
                                <span class="result-badge" style="background: #fef3c7; color: #92400e;">執行中</span>
                            </div>
                            <div class="result-details">
                                <p>${result.hint}</p>
                                <p>測試執行中，請稍候片刻...</p>
                            </div>
                        </div>
                    </div>
                `;

                // 開始輪詢狀態
                pollTestStatus();

            } catch (error) {
                document.getElementById('currentResult').innerHTML = `
                    <div class="result-item error">
                        <div class="result-header">
                            <strong>執行錯誤</strong>
                            <span class="result-badge badge-error">ERROR</span>
                        </div>
                        <div class="result-details">
                            ${error.message || '無法連接到後端服務'}
                        </div>
                    </div>
                `;
            } finally {
                // 不要在這裡重置狀態，等輪詢完成再說
            }
        }

        // 輪詢測試狀態
        let pollInterval = null;
        async function pollTestStatus() {
            if (pollInterval) clearInterval(pollInterval);

            pollInterval = setInterval(async () => {
                try {
                    const response = await fetch(`${API_BASE}/status`);
                    const data = await response.json();

                    // 如果測試還在執行中，繼續等待
                    if (data.is_busy) {
                        return;
                    }

                    // 測試完成了
                    clearInterval(pollInterval);
                    isRunning = false;
                    document.getElementById('runBtn').disabled = false;

                    // 顯示測試結果
                    if (!data.is_busy && data.latest !== null) {
                        const result = data.latest.result;
                        const testCase = document.getElementById('testCase').value;
                        const env = document.getElementById('env').value;
                        const site = document.getElementById('site').value;

                        const historyItem = {
                            timestamp: new Date().toLocaleString('zh-TW'),
                            testCase,
                            env,
                            site,
                            result
                        };
                        testHistory.unshift(historyItem);
                        if (testHistory.length > 20) testHistory.pop();
                        localStorage.setItem('testHistory', JSON.stringify(testHistory));

                        displayResult(result);
                        renderHistory();

                        // 重新載入 traces
                        setTimeout(() => loadTraceSessions(), 2000);
                    }

                } catch (error) {
                    console.error('輪詢狀態失敗:', error);
                    clearInterval(pollInterval);
                    isRunning = false;
                    document.getElementById('runBtn').disabled = false;
                }
            }, 2000); // 每 2 秒檢查一次
        }

        // 顯示結果
        function displayResult(result) {
            const statusClass = result.success ? 'success' : 'error';
            const badgeClass = result.success ? 'badge-success' : 'badge-error';
            const statusText = result.success ? '✓ 通過' : '✗ 失敗';

            const links = [];
            if (result.html_report) {
                links.push(`<a href="${API_BASE}/api/reports/html" target="_blank">📊 HTML報告</a>`);
            }

            const summary = result.summary || {};
            const passed = summary.passed || 0;
            const failed = summary.failed || 0;
            const duration = result.duration || 0;

            document.getElementById('currentResult').innerHTML = `
                <div class="result-panel">
                    <div class="result-item ${statusClass}">
                        <div class="result-header">
                            <strong>${result.message || '測試完成'}</strong>
                            <span class="result-badge ${badgeClass}">${statusText}</span>
                        </div>
                        <div class="result-details">
                            <p>執行時間: ${duration} 秒</p>
                            <p>通過: ${passed} | 失敗: ${failed}</p>
                        </div>
                        ${links.length > 0 ? `<div class="result-links">${links.join('')}</div>` : ''}
                    </div>
                </div>
            `;
        }

        // 渲染歷史記錄
        function renderHistory() {
            const historyList = document.getElementById('historyList');

            if (testHistory.length === 0) {
                historyList.innerHTML = '<p style="text-align: center; color: #9ca3af; padding: 40px;">尚無測試記錄</p>';
                return;
            }

            historyList.innerHTML = testHistory.map((item, index) => {
                const statusIcon = item.result.success ? '✓' : '✗';
                const statusColor = item.result.success ? '#10b981' : '#ef4444';

                return `
                    <div class="history-item" onclick="showHistoryDetail(${index})">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <strong>${item.testCase}</strong> - ${item.env}/${item.site}
                                <div class="history-time">${item.timestamp}</div>
                            </div>
                            <span style="color: ${statusColor}; font-size: 20px;">${statusIcon}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 顯示歷史詳情
        function showHistoryDetail(index) {
            const item = testHistory[index];
            displayResult(item.result);
        }

        // 清除結果
        function clearResults() {
            document.getElementById('currentResult').innerHTML = '';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        // 載入 Trace Sessions
        async function loadTraceSessions() {
            const container = document.getElementById('traceContainer');

            try {
                const response = await fetch(`${API_BASE}/api/traces/sessions`);
                const sessions = await response.json();

                if (sessions.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div style="font-size: 48px; margin-bottom: 15px;">📭</div>
                            <h3>目前沒有失敗測試的 Trace</h3>
                            <p>當測試失敗時，Trace 檔案會自動保存在這裡</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = `
                    <div class="trace-sessions">
                        ${sessions.map(session => `
                            <div class="trace-session">
                                <div class="session-header" onclick="toggleTraceFiles('${session.session_id}')">
                                    <span class="session-title">📅 ${session.session_id}</span>
                                    <span class="session-count">${session.count || session.trace_count || 0} 個失敗測試</span>
                                </div>
                                <div class="trace-files" id="traces-${session.session_id}">
                                    ${session.traces.map(trace => `
                                        <div class="trace-file">
                                            <div>
                                                <div class="trace-name">🔴 ${trace.test_name || trace.name}</div>
                                                <div class="trace-size">${(trace.size / 1024).toFixed(2)} KB</div>
                                            </div>
                                            <button class="btn-view-trace" onclick="viewTrace('${session.session_id}', '${trace.name}')">
                                                查看 Trace
                                            </button>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } catch (error) {
                console.error('載入 traces 失敗:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size: 48px; margin-bottom: 15px;">⚠️</div>
                        <h3>載入失敗</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // 切換 Trace 檔案列表
        function toggleTraceFiles(sessionId) {
            const element = document.getElementById(`traces-${sessionId}`);
            element.classList.toggle('active');
        }

        // 查看 Trace
        function viewTrace(sessionId, traceName) {
            const traceUrl = `${API_BASE}/traces/${sessionId}/${traceName}`;
            const viewerUrl = `${API_BASE}/viewer?trace=${encodeURIComponent(traceUrl)}`;
            window.open(viewerUrl, '_blank');
        }

        // 定期檢查狀態
        setInterval(checkStatus, 5000);

        // 定期更新 traces
        setInterval(loadTraceSessions, 30000);
    </script>
</body>
</html>
