<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E2E 測試控制台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .status-bar {
            background: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.idle {
            background: #10b981;
        }

        .status-dot.busy {
            background: #f59e0b;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        .card {
            background: white;
            border-radius: 10px;
            padding: 25px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .test-selector {
            margin-bottom: 20px;
        }

        .test-selector label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
        }

        .test-selector select,
        .test-selector input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e5e7eb;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        .test-selector select:focus,
        .test-selector input:focus {
            outline: none;
            border-color: #667eea;
        }

        .test-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #10b981;
            color: white;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #059669;
            transform: translateY(-2px);
        }

        .btn-outline {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-outline:hover {
            background: #667eea;
            color: white;
        }

        .result-panel {
            background: #f9fafb;
            border-radius: 6px;
            padding: 15px;
            margin-top: 15px;
            max-height: 50vh;
            overflow-y: auto;
        }

        .result-item {
            background: white;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .result-item.success {
            border-left-color: #10b981;
        }

        .result-item.error {
            border-left-color: #ef4444;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .result-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-success {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-error {
            background: #fee2e2;
            color: #991b1b;
        }

        .result-details {
            font-size: 14px;
            color: #6b7280;
            line-height: 1.6;
        }

        .result-links {
            margin-top: 10px;
            display: flex;
            gap: 10px;
        }

        .result-links a {
            color: #667eea;
            text-decoration: none;
            font-size: 13px;
        }

        .result-links a:hover {
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .spinner {
            border: 3px solid #f3f4f6;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .history-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .history-item {
            background: #f9fafb;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .history-item:hover {
            background: #f3f4f6;
        }

        .history-time {
            font-size: 12px;
            color: #9ca3af;
        }

        /* Trace Viewer 相關樣式 */
        .trace-sessions {
            display: grid;
            gap: 12px;
        }

        .trace-session {
            background: #f9fafb;
            border-radius: 8px;
            padding: 15px;
            border: 2px solid #e5e7eb;
            transition: all 0.3s;
        }

        .trace-session:hover {
            border-color: #667eea;
            background: #f3f4f6;
        }

        .session-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .session-title {
            font-weight: 600;
            color: #374151;
        }

        .session-count {
            background: #ef4444;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .trace-files {
            display: none;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #e5e7eb;
            gap: 8px;
            flex-direction: column;
        }

        .trace-files.active {
            display: flex !important;
        }

        .trace-file {
            background: white;
            padding: 10px 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .trace-file:hover {
            background: #ede9fe;
            transform: translateX(5px);
        }

        .session-toggle-icon {
            transition: transform 0.2s;
            display: inline-block;
            margin-left: 8px;
            color: #9ca3af;
        }

        .trace-session.expanded .session-toggle-icon {
            transform: rotate(90deg);
        }

        .trace-name {
            font-size: 14px;
            color: #374151;
        }

        .trace-size {
            font-size: 12px;
            color: #9ca3af;
        }

        .btn-view-trace {
            padding: 6px 12px;
            font-size: 13px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-view-trace:hover {
            background: #5568d3;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
        }

        .toolbar-buttons {
            display: flex;
            gap: 10px;
        }

        /* Toast 通知樣式 */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 350px;
        }

        .toast {
            background: white;
            padding: 16px 20px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease-out;
            border-left: 4px solid #ef4444;
        }

        .toast.success {
            border-left-color: #10b981;
        }

        .toast.warning {
            border-left-color: #f59e0b;
        }

        .toast.error {
            border-left-color: #ef4444;
        }

        .toast-icon {
            font-size: 24px;
            flex-shrink: 0;
        }

        .toast-content {
            flex: 1;
        }

        .toast-title {
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 4px;
            font-size: 14px;
        }

        .toast-message {
            color: #6b7280;
            font-size: 13px;
            line-height: 1.4;
        }

        .toast-close {
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 20px;
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .toast-close:hover {
            background: #f3f4f6;
            color: #374151;
        }

        @keyframes slideIn {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(400px);
                opacity: 0;
            }
        }

        .toast.removing {
            animation: slideOut 0.3s ease-in forwards;
        }

        /* AI 分析樣式 */
        .ai-analysis {
            background: #f0f9ff;
            border: 2px solid #0ea5e9;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }

        .ai-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            color: #0369a1;
            margin-bottom: 12px;
            font-size: 15px;
        }

        .ai-summary {
            background: white;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 12px;
            color: #374151;
            font-size: 14px;
        }

        .failed-test-item {
            background: white;
            border-left: 3px solid #ef4444;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .test-name {
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 8px;
        }

        .ai-field {
            margin: 6px 0;
            font-size: 13px;
            line-height: 1.5;
        }

        .ai-field strong {
            color: #4b5563;
            display: inline-block;
            min-width: 80px;
        }

        .category-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            background: #fee2e2;
            color: #991b1b;
        }


        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .test-buttons {
                grid-template-columns: 1fr;
            }

            .toolbar-buttons {
                flex-wrap: wrap;
            }

            .toast-container {
                left: 20px;
                right: 20px;
                max-width: none;
            }
        }
    </style>
</head>
<body>
    <!-- Toast 容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <div class="container">
        <div class="header">
            <h1>🎯 測試控制台</h1>
            <p>選擇項目並執行測試</p>
        </div>

        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-dot idle" id="statusDot"></div>
                <span id="statusText">系統閒置中</span>
            </div>
            <div class="toolbar-buttons">
                <button class="btn btn-outline" onclick="window.open('/api/reports/html', '_blank')">
                    📊 HTML 報告
                </button>
                <button class="btn btn-primary" style="background: #ff5a5f; border: none;" onclick="viewAllure()">
                    📊 Allure 報表
                </button>
                <button class="btn btn-secondary" onclick="checkStatus()">更新狀態</button>
            </div>
        </div>

        <div class="main-content">
            <!-- 測試執行面板 -->
            <div class="card">
                <h2>執行測試</h2>

                <div class="test-selector">
                    <label>測試案例</label>
                    <select id="testCase">
                        <option value="regression">迴歸測試</option>
                        <option value="maintain_check">維護轉導檢查</option>
                    </select>
                </div>

                <div class="test-selector">
                    <label>環境</label>
                    <select id="env">
                        <option value="uat">使用者驗收環境 (UAT)</option>
                        <option value="dev">開發環境 (DEV)</option>
                    </select>
                </div>

                <div class="test-selector">
                    <label>站點</label>
                    <select id="site">
                        <option value="new20">2.0</option>
                        <option value="hr2222">Stage現金站(hr2222)</option>
                        <option value="hr5555">StageApi站(hr5555)</option>
                        <option value="spg">SPG(未開發)</option>
                    </select>
                </div>

                <div class="test-selector">
                    <label>自訂帳號 (選填)</label>
                    <input type="text" id="username" placeholder="留空使用預設帳號">
                </div>

                <div class="test-selector">
                    <label>自訂密碼 (選填)</label>
                    <input type="password" id="password" placeholder="留空使用預設密碼">
                </div>

                <div class="test-buttons">
                    <button class="btn btn-primary" onclick="runTest()" id="runBtn">
                        ▶️ 執行測試
                    </button>
                    <button class="btn btn-secondary" onclick="clearResults()">
                        🗑️ 清除結果
                    </button>
                </div>

                <div id="currentResult"></div>
            </div>

            <!-- 測試歷史面板 -->
            <div class="card">
                <h2>測試歷史</h2>
                <div class="history-list" id="historyList">
                    <p style="text-align: center; color: #9ca3af; padding: 40px;">
                        尚無測試記錄
                    </p>
                </div>
            </div>

            <!-- Trace Viewer 面板 -->
            <div class="card full-width">
                <h2>🔍 失敗測試追蹤 (Traces)</h2>
                <div id="traceContainer">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>載入中...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://' + window.location.hostname + ':8000';
        let testHistory = JSON.parse(localStorage.getItem('testHistory') || '[]');
        let isRunning = false;
        let lastServiceStatus = true; // 追蹤上次的服務狀態
        let serviceCheckFailCount = 0; // 連續檢查失敗次數
        const POLL_TIMEOUT_MS = 5 * 60 * 1000; // 5 分鐘輪詢上限

        // Toast 通知系統
        const Toast = {
            show(message, title = '通知', type = 'error', duration = 5000) {
                const container = document.getElementById('toastContainer');
                const toastId = 'toast-' + Date.now();

                const icons = {
                    success: '✓',
                    warning: '⚠️',
                    error: '✗'
                };

                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.id = toastId;
                toast.innerHTML = `
                    <div class="toast-icon">${icons[type] || '📢'}</div>
                    <div class="toast-content">
                        <div class="toast-title">${title}</div>
                        <div class="toast-message">${message}</div>
                    </div>
                    <button class="toast-close" onclick="Toast.close('${toastId}')">×</button>
                `;

                container.appendChild(toast);

                // 自動關閉
                if (duration > 0) {
                    setTimeout(() => {
                        Toast.close(toastId);
                    }, duration);
                }

                return toastId;
            },

            close(toastId) {
                const toast = document.getElementById(toastId);
                if (toast) {
                    toast.classList.add('removing');
                    setTimeout(() => {
                        toast.remove();
                    }, 300);
                }
            },

            success(message, title = '成功') {
                return this.show(message, title, 'success');
            },

            warning(message, title = '警告') {
                return this.show(message, title, 'warning');
            },

            error(message, title = '錯誤') {
                return this.show(message, title, 'error');
            }
        };

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            checkStatus();
            renderHistory();
            loadTraceSessions();

            // Event delegation for trace container (避免 XSS)
            document.getElementById('traceContainer').addEventListener('click', (e) => {
                const header = e.target.closest('.session-header');
                const viewBtn = e.target.closest('.btn-view-trace');

                if (header) {
                    toggleTraceFiles(header.dataset.sessionId);
                } else if (viewBtn) {
                    viewTrace(viewBtn.dataset.sessionId, viewBtn.dataset.traceName);
                }
            });
        });

        // 檢查狀態
        async function checkStatus() {
            try {
                const response = await fetch(`${API_BASE}/status`);
                const data = await response.json();

                const statusDot = document.getElementById('statusDot');
                const statusText = document.getElementById('statusText');

                if (data.is_busy) {
                    statusDot.className = 'status-dot busy';
                    statusText.textContent = `執行中: ${data.current_test || '測試中'}`;
                    isRunning = true;
                } else {
                    statusDot.className = 'status-dot idle';
                    statusText.textContent = '系統閒置中';
                    isRunning = false;
                }

                document.getElementById('runBtn').disabled = isRunning;

                // 服務恢復正常
                if (!lastServiceStatus) {
                    Toast.success('服務已恢復連接', '連接成功');
                    lastServiceStatus = true;
                }
                serviceCheckFailCount = 0;

            } catch (error) {
                console.error('無法連接到後端服務:', error);
                serviceCheckFailCount++;

                // 只在第一次失敗或連續失敗3次時顯示 Toast
                if (lastServiceStatus || serviceCheckFailCount >= 3) {
                    document.getElementById('statusText').textContent = '⚠️ 無法連接服務';
                    Toast.error('服務無法連接，請檢查服務狀態', '未連接到服務', 8000);
                    lastServiceStatus = false;
                }
            }
        }

        // 執行測試
        async function runTest() {
            const testCase = document.getElementById('testCase').value;
            const env = document.getElementById('env').value;
            const site = document.getElementById('site').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const url = `${API_BASE}/api/tests/${testCase}`
            const payload = { env, site};
            if (username) payload.username = username;
            if (password) payload.password = password;

            document.getElementById('currentResult').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>測試執行中，請稍候...</p>
                </div>
            `;

            document.getElementById('runBtn').disabled = true;
            isRunning = true;
            checkStatus();

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const result = await response.json();

                // 測試已啟動，顯示提示訊息
                document.getElementById('currentResult').innerHTML = `
                    <div class="result-panel">
                        <div class="result-item" style="border-left-color: #f59e0b;">
                            <div class="result-header">
                                <strong>⏳ ${result.message}</strong>
                                <span class="result-badge" style="background: #fef3c7; color: #92400e;">執行中</span>
                            </div>
                            <div class="result-details">
                                <p>${result.hint}</p>
                                <p>測試執行中，請稍候片刻...</p>
                            </div>
                        </div>
                    </div>
                `;

                Toast.success('測試已啟動，請稍候片刻', '測試啟動');

                // 開始輪詢狀態
                pollTestStatus();

            } catch (error) {
                document.getElementById('currentResult').innerHTML = `
                    <div class="result-item error">
                        <div class="result-header">
                            <strong>執行錯誤</strong>
                            <span class="result-badge badge-error">ERROR</span>
                        </div>
                        <div class="result-details">
                            ${error.message || '無法連接到後端服務'}
                        </div>
                    </div>
                `;
                Toast.error(error.message || '無法連接到後端服務', '執行失敗');
            }
        }

        // 輪詢測試狀態
        let pollInterval = null;
        async function pollTestStatus() {
            if (pollInterval) clearInterval(pollInterval);

            const pollStartTime = Date.now();

            pollInterval = setInterval(async () => {
                // 超過 5 分鐘自動停止
                if (Date.now() - pollStartTime > POLL_TIMEOUT_MS) {
                    clearInterval(pollInterval);
                    isRunning = false;
                    document.getElementById('runBtn').disabled = false;
                    Toast.warning('測試執行時間過長，請手動確認狀態', '輪詢逾時');
                    return;
                }

                try {
                    const response = await fetch(`${API_BASE}/status`);
                    const data = await response.json();

                    // 如果測試還在執行中，繼續等待
                    if (data.is_busy) {
                        return;
                    }

                    // 測試完成了
                    clearInterval(pollInterval);
                    isRunning = false;
                    document.getElementById('runBtn').disabled = false;

                    // 顯示測試結果
                    if (!data.is_busy && data.latest !== null) {
                        const result = data.latest.result;
                        const testCase = document.getElementById('testCase').value;
                        const env = document.getElementById('env').value;
                        const site = document.getElementById('site').value;

                        const historyItem = {
                            timestamp: new Date().toLocaleString('zh-TW'),
                            testCase,
                            env,
                            site,
                            result
                        };
                        testHistory.unshift(historyItem);
                        if (testHistory.length > 20) testHistory.pop();
                        localStorage.setItem('testHistory', JSON.stringify(testHistory));

                        displayResult(result);
                        renderHistory();

                        // 顯示測試完成通知
                        if (result.success) {
                            Toast.success('所有測試案例已通過', '測試完成');
                        } else {
                            Toast.warning('部分測試案例未通過，請查看詳細報告', '測試完成');
                        }

                        // 重新載入 traces
                        setTimeout(() => loadTraceSessions(), 3000);
                    }

                } catch (error) {
                    console.error('輪詢狀態失敗:', error);
                    clearInterval(pollInterval);
                    isRunning = false;
                    document.getElementById('runBtn').disabled = false;
                }
            }, 2000); // 每 2 秒檢查一次
        }

        // 顯示結果
        function displayResult(result) {
            const statusClass = result.success ? 'success' : 'error';
            const badgeClass = result.success ? 'badge-success' : 'badge-error';
            const statusText = result.success ? '✓ 通過' : '✗ 失敗';

            const links = [];
            if (result.html_report) {
                links.push(`<a href="${API_BASE}/api/reports/html" target="_blank">📊 HTML報告</a>`);
            }

            const summary = result.summary || {};
            const passed = summary.passed || 0;
            const failed = summary.failed || 0;
            const duration = result.duration || 0;

            // AI 分析區塊
            let aiAnalysisHtml = '';
            if (result.ai_analysis) {
                const ai = result.ai_analysis;
                aiAnalysisHtml = `
                    <div class="ai-analysis">
                        <div class="ai-header">
                            🤖 AI 診斷報告
                        </div>
                        <div class="ai-summary">
                            ${ai.summary || '無摘要'}
                        </div>
                        ${ai.failed_tests && ai.failed_tests.length > 0 ? ai.failed_tests.map(test => `
                            <div class="failed-test-item">
                                <div class="test-name">${test.test_name}</div>
                                <div class="ai-field">
                                    <strong>原因：</strong>${test.root_cause}
                                </div>
                                <div class="ai-field">
                                    <strong>類型：</strong><span class="category-badge">${test.category}</span>
                                </div>
                                ${test.last_screenshot_desc ? `<div class="ai-field"><strong>截圖：</strong>${test.last_screenshot_desc}</div>` : ''}
                                <div class="ai-field">
                                    <strong>建議：</strong>${test.suggested_action}
                                </div>
                                ${test.is_env_issue ? '<div class="ai-field" style="color: #dc2626;">⚠️ 疑似環境問題</div>' : ''}
                            </div>
                        `).join('') : ''}
                    </div>
                `;
            }

            document.getElementById('currentResult').innerHTML = `
                <div class="result-panel">
                    <div class="result-item ${statusClass}">
                        <div class="result-header">
                            <strong>${result.message || '測試完成'}</strong>
                            <span class="result-badge ${badgeClass}">${statusText}</span>
                        </div>
                        <div class="result-details">
                            <p>執行時間: ${duration} 秒</p>
                            <p>通過: ${passed} | 失敗: ${failed}</p>
                        </div>
                        ${links.length > 0 ? `<div class="result-links">${links.join('')}</div>` : ''}
                    </div>
                    ${aiAnalysisHtml}
                </div>
            `;
        }

        // 渲染歷史記錄
        function renderHistory() {
            const historyList = document.getElementById('historyList');

            if (testHistory.length === 0) {
                historyList.innerHTML = '<p style="text-align: center; color: #9ca3af; padding: 40px;">尚無測試記錄</p>';
                return;
            }

            historyList.innerHTML = testHistory.map((item, index) => {
                const statusIcon = item.result.success ? '✓' : '✗';
                const statusColor = item.result.success ? '#10b981' : '#ef4444';

                return `
                    <div class="history-item" onclick="showHistoryDetail(${index})">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div>
                                <strong>${item.testCase}</strong> - ${item.env}/${item.site}
                                <div class="history-time">${item.timestamp}</div>
                            </div>
                            <span style="color: ${statusColor}; font-size: 20px;">${statusIcon}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 顯示歷史詳情
        function showHistoryDetail(index) {
            const item = testHistory[index];
            displayResult(item.result);
        }

        // 清除結果
        function clearResults() {
            document.getElementById('currentResult').innerHTML = '';
        }

        // 載入 Trace Sessions
        async function loadTraceSessions() {
            const container = document.getElementById('traceContainer');

            try {
                const response = await fetch(`${API_BASE}/api/traces/sessions`);
                const sessions = await response.json();

                if (sessions.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <div style="font-size: 48px; margin-bottom: 15px;">📭</div>
                            <h3>目前沒有失敗測試的 Trace</h3>
                            <p>當測試失敗時，Trace 檔案會自動保存在這裡</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = `
                    <div class="trace-sessions">
                        ${sessions.map(session => {
                            const safeSessionId = session.session_id.replace(/"/g, '&quot;');
                            return `
                            <div class="trace-session">
                                <div class="session-header" data-session-id="${safeSessionId}">
                                    <span class="session-title">📅 ${session.session_id}</span>
                                    <span>
                                        <span class="session-count">${session.count || session.trace_count || 0} 個失敗測試</span>
                                        <span class="session-toggle-icon">▶</span>
                                    </span>
                                </div>
                                <div class="trace-files" id="traces-${safeSessionId}">
                                    ${session.traces.map(trace => {
                                        const safeName = trace.name.replace(/"/g, '&quot;');
                                        const displayName = trace.test_name || trace.name;
                                        return `
                                        <div class="trace-file">
                                            <div>
                                                <div class="trace-name">🔴 ${displayName}</div>
                                                <div class="trace-size">${(trace.size / 1024).toFixed(2)} KB</div>
                                            </div>
                                            <button class="btn-view-trace"
                                                data-session-id="${safeSessionId}"
                                                data-trace-name="${safeName}">
                                                查看 Trace
                                            </button>
                                        </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                            `;
                        }).join('')}
                    </div>
                `;
            } catch (error) {
                console.error('載入 traces 失敗:', error);
                container.innerHTML = `
                    <div class="empty-state">
                        <div style="font-size: 48px; margin-bottom: 15px;">⚠️</div>
                        <h3>載入失敗</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        // 切換 Trace 檔案列表
        function toggleTraceFiles(sessionId) {
            const element = document.getElementById(`traces-${sessionId}`);
            const session = element?.closest('.trace-session');
            if (element) {
                element.classList.toggle('active');
                session?.classList.toggle('expanded');
            } else {
                console.error(`找不到 ID: traces-${sessionId}`);
            }
        }

        // 查看 Trace
        function viewTrace(sessionId, traceName) {
            const traceUrl = `${API_BASE}/traces/${sessionId}/${traceName}`;
            const link = document.createElement('a');
            link.href = traceUrl;
            link.download = traceName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            Toast.success('Trace 檔案已開始下載', '下載中');
            setTimeout(() => {
                window.open('https://trace.playwright.dev/', '_blank');
                Toast.show('請將下載的 zip 檔案拖入新開啟的網頁查看', '查看提示', 'warning', 8000);
            }, 500);
        }

        // 定期檢查狀態 - 改為 10 秒一次
        setInterval(checkStatus, 10000);

        // 定期更新 traces
        setInterval(loadTraceSessions, 30000);

        // 查看 Allure
        async function viewAllure() {
            try {
                const response = await fetch(`${API_BASE}/api/reports/allure`);
                if (response.ok) {
                    const data = await response.json();
                    window.open(`${API_BASE}${data.url}`, '_blank');
                } else {
                    const err = await response.json();
                    Toast.warning(err.detail || '報告未就緒');
                }
            } catch (error) {
                console.error('Allure 錯誤:', error);
                Toast.error('無法取得報告路徑');
            }
        }
    </script>
</body>
</html>
