services:
  # 角色一：長期運行的控制台 (Web)
  webservice:
    build: .
    image: test-image:latest
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - ${REPORTS_DIR:-./reports}:/app/reports
    command: python -m uvicorn webservice.main:app --host 0.0.0.0 --port 8000
    restart: always                # 確保 Web 服務掛了會自動重啟

  # 角色二：臨時的測試任務 (Tester)
  tester:
    image: test-image:latest
    volumes:
      - ${REPORTS_DIR:-./reports}:/app/reports     # 寫入同一個抽屜
    environment:
      WEBHOOK_URL: ${GCHAT_WEBHOOK_URL:-}    # 空值等於停用通知
      REPORT_BASE_URL: ${REPORT_BASE_URL:-}  # 空值等於訊息不附報告連結
    # 用 notify.py 包住 pytest，結束時發 Google Chat 通知
    command: python scripts/notify.py -m apicheck --color=no --html=reports/cicd_report.html
    profiles:
      - "task"                     # 標記為任務模式，平時 docker-compose up 不會誤觸它