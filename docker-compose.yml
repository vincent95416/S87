services:
  # 角色一：長期運行的控制台 (Web)
  webservice:
    build: .
    image: test-image:latest  # 給這個鏡像一個統一的名字
    ports:
      - "8000:8000"
    volumes:
      - /home/ssport/test_output:/app/reports
      - /home/ssport/test_traces:/app/traces
      - ./dashboard.html:/app/dashboard.html
      - ./webservice:/app/webservice
      - /root/.claude:/root/.claude:ro   # 掛載 Team OAuth 憑證（唯讀）
    command: python -m uvicorn webservice.main:app --host 0.0.0.0 --port 8000
    restart: always                # 確保 Web 服務掛了會自動重啟

  # 角色二：臨時的測試任務 (Tester)
  tester:
    image: test-image:latest  # 直接用上面 build 好的，不用重新 build
    volumes:
      - /home/ssport/test_output:/app/reports     # 寫入同一個抽屜
      - /root/.claude:/root/.claude:ro   # 掛載 Team OAuth 憑證（唯讀）
    # 這裡放你原本跑測試的完整指令
    command: pytest -m apicheck --html=reports/cicd_report.html --self-contained-html
    profiles:
      - "task"                     # 標記為任務模式，平時 docker-compose up 不會誤觸它